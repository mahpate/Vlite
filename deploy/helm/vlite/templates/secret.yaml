{{- if not .Values.auth.existingSecret }}
{{- $token := required "Set auth.existingSecret or provide auth.token (32..256 base64url characters)" .Values.auth.token }}
{{- if not (regexMatch "^[A-Za-z0-9_-]{32,256}$" $token) }}
{{- fail "auth.token must contain 32..256 base64url characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vlite.name" . }}
  labels:
    {{- include "vlite.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey | quote }}: {{ $token | quote }}
{{- end }}

name: VLite release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo check --locked --no-default-features --lib
      - run: cargo build --locked --release --bins --all-features
      - name: Package binaries, contract and documentation
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, zipfile
          host = subprocess.check_output(["rustc", "-vV"], text=True).split("host: ")[1].splitlines()[0]
          output = pathlib.Path("dist")
          output.mkdir()
          archive = output / f"vlite-{host}.zip"
          suffix = ".exe" if os.name == "nt" else ""
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
              for name in ["vlite-server", "vlite-maintain", "vlite-bench", "vlite-smoke"]:
                  bundle.write(pathlib.Path("target/release") / (name + suffix), name + suffix)
              for name in ["README.md", "Cargo.toml", "Cargo.lock", "src/openapi.json",
                           "compose.yaml", "compose.tls.yaml", "deploy/Caddyfile", "Dockerfile",
                           "docs/REFERENCE.md", "benchmarks/README.md", "benchmarks/RESULTS.md"]:
                  bundle.write(name)
          (output / (archive.name + ".sha256")).write_text(
              hashlib.sha256(archive.read_bytes()).hexdigest() + "  " + archive.name + "\n", encoding="ascii")
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: vlite-release:test
      - name: Test the exact runtime image without rebuilding
        env:
          VLITE_IMAGE: vlite-release:test
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/rest_e2e.py
      - name: Test HTTPS with the same runtime image
        env:
          VLITE_IMAGE: vlite-release:test
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/tls_e2e.py

  image-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, image-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      name: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and derive lowercase registry name
        id: name
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "tag must match Cargo.toml version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("image=ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower() + "\n")
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

  image-verify:
    needs: image-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and verify the published digest without rebuilding
        env:
          VLITE_IMAGE: ${{ needs.image-publish.outputs.name }}@${{ needs.image-publish.outputs.digest }}
          VLITE_E2E_NO_BUILD: "1"
        run: |
          docker pull "$VLITE_IMAGE"
          python3 tests/rest_e2e.py
          python3 tests/tls_e2e.py

  release:
    needs: [image-publish, image-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Publish release with digest-pinned image and native checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.image-publish.outputs.name }}
          DIGEST: ${{ needs.image-publish.outputs.digest }}
        run: |
          printf '%s\n\n%s\n' "Container: $IMAGE@$DIGEST" "Back up before upgrading. See the README migration and rollback procedure. No authentication bypass is enabled in this image." > release-notes.txt
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "VLite $GITHUB_REF_NAME" --notes-file release-notes.txt

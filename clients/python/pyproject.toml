[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vlite-client"
version = "0.3.0"
description = "Python REST client for VLite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://mahpate.github.io/Vlite/"
Documentation = "https://mahpate.github.io/Vlite/api.html"
Repository = "https://github.com/mahpate/Vlite"
Issues = "https://github.com/mahpate/Vlite/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<2"]
llamaindex = ["llama-index-core>=0.12,<1"]
integrations = ["langchain-core>=0.3,<2", "llama-index-core>=0.12,<1"]

[tool.setuptools.package-data]
vlite_client = ["py.typed"]

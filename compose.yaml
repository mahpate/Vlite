services:
  vlite:
    image: ${VLITE_IMAGE:-vlite-smoke:local}
    build:
      context: .
      target: runtime
    volumes:
      - vlite-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tests:
    profiles:
      - test
    build:
      context: .
      target: test

  api:
    profiles:
      - api
      - dashboard
    image: ${VLITE_API_IMAGE:-${VLITE_IMAGE:-vlite-api:local}}
    build:
      context: .
      target: api
    entrypoint: ["/usr/local/bin/vlite-server"]
    command: ["${VLITE_DATABASE_PATH:-/data/vectors.vlite}", "--create-if-missing", "${VLITE_DIMENSIONS:-3}", "--bind", "0.0.0.0:8080", "--allow-remote"]
    environment:
      - VLITE_AUTH_TOKEN_FILE=/run/secrets/api_token
      - VLITE_ADMIN_DIR=/admin
      - VLITE_READ_ONLY_TOKEN
      - VLITE_READ_ONLY_TOKEN_FILE
    secrets:
      - api_token
    ports:
      - "127.0.0.1:${VLITE_PORT:-18084}:8080"
    volumes:
      - api-data:/data
      - api-admin-data:/admin
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r response <&3;
          [[ "$$response" == *" 200 "* ]]'
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  dashboard:
    profiles:
      - dashboard
    image: ${VLITE_DASHBOARD_IMAGE:-vlite-dashboard:local}
    build:
      context: .
      target: dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VLITE_DASHBOARD_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  vlite-data:
  api-data:
  api-admin-data:

secrets:
  api_token:
    file: ${VLITE_TOKEN_FILE:-.secrets/api-token}

services:
  vlite:
    image: ${VLITE_IMAGE:-vlite-smoke:local}
    build:
      context: .
      target: runtime
    volumes:
      - vlite-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tests:
    profiles:
      - test
    build:
      context: .
      target: test

  api:
    profiles:
      - api
      - dashboard
    image: ${VLITE_IMAGE:-vlite-smoke:local}
    build:
      context: .
      target: runtime
    entrypoint: ["/usr/local/bin/vlite-server"]
    command: ["${VLITE_DATABASE_PATH:-/data/vectors.vlite}", "--create-if-missing", "${VLITE_DIMENSIONS:-3}", "--bind", "0.0.0.0:8080", "--allow-remote"]
    environment:
      VLITE_AUTH_TOKEN_FILE: /run/secrets/api_token
    secrets:
      - api_token
    ports:
      - "127.0.0.1:${VLITE_PORT:-8080}:8080"
    volumes:
      - api-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  dashboard:
    profiles:
      - dashboard
    image: ${VLITE_DASHBOARD_IMAGE:-vlite-dashboard:local}
    build:
      context: .
      target: dashboard
    depends_on:
      - api
    ports:
      - "127.0.0.1:${VLITE_DASHBOARD_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  vlite-data:
  api-data:

secrets:
  api_token:
    file: ${VLITE_TOKEN_FILE:-.secrets/api-token}

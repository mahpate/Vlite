name: Capture connected dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the matching backend on this isolated runner
        run: |
          cargo build --locked --features server --bin vlite-server
          mkdir -p "$RUNNER_TEMP/capture-image"
          cp target/debug/vlite-server "$RUNNER_TEMP/capture-image/"
          printf '%s\n' 'FROM ubuntu:24.04' 'COPY vlite-server /usr/local/bin/' 'ENTRYPOINT ["/usr/local/bin/vlite-server"]' | docker build -t vlite-capture:source -f - "$RUNNER_TEMP/capture-image"
      - run: python -m pip install -r tests/requirements-dashboard.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_connected_dashboard.py captures
        env:
          VLITE_CAPTURE_IMAGE: vlite-capture:source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-dashboard
          path: captures/

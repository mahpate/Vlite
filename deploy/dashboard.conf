server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 8m;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vlite_api api:8080;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$vlite_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

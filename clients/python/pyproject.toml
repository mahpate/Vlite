[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vlite-client"
version = "0.1.0"
description = "Python REST client for VLite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.package-data]
vlite_client = ["py.typed"]

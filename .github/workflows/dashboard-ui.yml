name: Dashboard UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/dashboard/**"
      - "tests/*admin*"
      - "tests/*console*"
      - "tests/*navigation*"
      - "tests/dashboard*"
      - ".github/workflows/dashboard-ui.yml"
  pull_request:
    paths:
      - "src/dashboard/**"
      - "tests/*admin*"
      - "tests/*console*"
      - "tests/*navigation*"
      - "tests/dashboard*"
      - ".github/workflows/dashboard-ui.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check dashboard helpers
        run: |
          node --test tests/console_tools.test.cjs tests/navigation.test.cjs tests/dashboard_interactions.test.cjs tests/admin_tools.test.cjs tests/dashboard_graph.test.cjs
          python tests/admin_route_coverage.py
      - run: python -m pip install -r tests/requirements-dashboard.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check browser workflows without a backend
        run: |
          python tests/dashboard_e2e.py --mocked
          python tests/admin_e2e.py

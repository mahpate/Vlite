name: VLite release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate candidate identity before building
        shell: python
        run: |
          import json, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          assert tomllib.loads(pathlib.Path("bindings/c/Cargo.toml").read_text())["package"]["version"] == version
          assert json.loads(pathlib.Path("src/openapi.json").read_text())["info"]["version"] == version
          for name in ["clients/python/pyproject.toml", "bindings/python/pyproject.toml"]:
              assert tomllib.loads(pathlib.Path(name).read_text())["project"]["version"] == version
          for name in ["clients/javascript/package.json", "bindings/node/package.json"]:
              assert json.loads(pathlib.Path(name).read_text())["version"] == version
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_REF_NAME"] == "v" + version, "tag must match all package versions"
      - run: python tests/release_assets.py
      - run: python tests/wheel_platform.py

  clients:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node tests/console_tools.test.cjs
      - run: python -m unittest discover -s clients/python -p test_client.py
      - run: python -m pip wheel --no-deps --wheel-dir dist ./clients/python
      - name: Verify installed REST Python wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path("dist").glob("vlite_client-*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "tests/client_wheel.py", str(wheels[0])], check=True)
      - run: npm --prefix clients/javascript ci --ignore-scripts
      - run: npm --prefix clients/javascript test
      - run: npm --prefix clients/javascript run typecheck
      - run: npm pack ./clients/javascript --ignore-scripts --pack-destination dist
      - name: Checksum client packages
        shell: python
        run: |
          import hashlib, pathlib
          for path in pathlib.Path("dist").iterdir():
              path.with_name(path.name + ".sha256").write_text(
                  hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n", encoding="ascii")
      - name: Verify installed REST Node package
        shell: python
        run: |
          import pathlib, subprocess
          packages = list(pathlib.Path("dist").glob("*.tgz"))
          assert len(packages) == 1
          subprocess.run(["node", "tests/node_package.mjs", str(packages[0]), "--rest"], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: native-rest-clients
          path: dist/*

  native:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo check --locked --no-default-features --lib
      - run: cargo build --locked --release --bins --all-features
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r tests/requirements-grpc.txt
      - name: Verify release gRPC binary with generated protobuf client
        env:
          VLITE_SERVER_BIN: target/release/vlite-server${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/grpc_smoke.py
      - run: cargo build --locked --release -p vlite-ffi
      - run: python tests/embedded_e2e.py target/release/${{ runner.os == 'Windows' && 'vlite_ffi.dll' || runner.os == 'macOS' && 'libvlite_ffi.dylib' || 'libvlite_ffi.so' }}
      - run: python bindings/build_wheel.py --output embedded-wheels
      - run: python tests/embedded_wheel.py embedded-wheels
      - run: npm --prefix bindings/node ci --ignore-scripts
      - run: npm --prefix bindings/node run build
      - run: npm --prefix bindings/node test
      - run: npm --prefix bindings/node run typecheck
      - run: node bindings/node/pack.mjs node-packages
      - name: Verify offline installed Node package
        shell: python
        run: |
          import pathlib, subprocess
          packages = list(pathlib.Path("node-packages").glob("*.tgz"))
          assert len(packages) == 1
          subprocess.run(["node", "tests/node_package.mjs", str(packages[0])], check=True)
      - name: Package binaries, contract and documentation
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, sys, zipfile
          host = subprocess.check_output(["rustc", "-vV"], text=True).split("host: ")[1].splitlines()[0]
          output = pathlib.Path("dist")
          output.mkdir()
          archive = output / f"vlite-{host}.zip"
          suffix = ".exe" if os.name == "nt" else ""
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
              library = "vlite_ffi.dll" if os.name == "nt" else "libvlite_ffi.dylib" if sys.platform == "darwin" else "libvlite_ffi.so"
              bundle.write(pathlib.Path("target/release") / library, library)
              if os.name == "nt":
                  bundle.write("target/release/vlite_ffi.dll.lib", "vlite_ffi.dll.lib")
              for name in ["vlite-server", "vlite-maintain", "vlite-bench", "vlite-smoke"]:
                  bundle.write(pathlib.Path("target/release") / (name + suffix), name + suffix)
              for name in ["README.md", "LICENSE", "Cargo.toml", "Cargo.lock", "src/openapi.json",
                           "compose.yaml", "compose.tls.yaml", "deploy/Caddyfile", "deploy/dashboard.conf", "Dockerfile",
                           "docs/REFERENCE.md", "docs/INSTALL.md", "docs/CONSOLE.md",
                           "docs/CONSOLE-ADMIN.md", "docs/DOCKER-OPERATIONS.md", "docs/CAPABILITIES.md",
                           "docs/RELEASE-0.2.0.md",
                           "docs/ANN-SNAPSHOTS.md", "docs/GRPC.md", "proto/vlite/v1/vlite.proto",
                           "benchmarks/README.md", "benchmarks/RESULTS.md",
                           "benchmarks/compare_rest.py", "benchmarks/native_campaign.py", "benchmarks/metric_campaign.py", "benchmarks/embedded.py",
                           "benchmarks/embedding_campaign.py", "benchmarks/prepare_glove.py", "benchmarks/requirements-embeddings.txt",
                           "benchmarks/background_campaign.py", "examples/background_hnsw.rs",
                           "benchmarks/search_capabilities_campaign.py", "examples/search_capabilities_bench.rs",
                           "benchmarks/ann_restart_campaign.py",
                           "examples/collections.rs", "examples/ann_restart_bench.rs",
                           "tests/measure_benchmark.py",
                           "clients/README.md", "clients/python/README.md",
                           "clients/python/pyproject.toml", "clients/python/LICENSE",
                           "clients/python/vlite_client/__init__.py",
                           "clients/python/vlite_client/py.typed",
                           "clients/javascript/README.md", "clients/javascript/LICENSE",
                           "clients/javascript/package.json", "clients/javascript/package-lock.json",
                           "clients/javascript/index.js", "clients/javascript/index.d.ts",
                           "clients/javascript/example.ts",
                           "bindings/README.md", "bindings/c/vlite.h", "bindings/c/example.c",
                           "bindings/python/README.md", "bindings/python/LICENSE",
                           "bindings/python/pyproject.toml", "bindings/python/setup.py",
                           "bindings/python/vlite_embedded/__init__.py",
                           "bindings/python/vlite_embedded/py.typed"] + [
                               str(path) for path in sorted(pathlib.Path("benchmarks/results").glob("*.json"))]:
                  bundle.write(name)
          (output / (archive.name + ".sha256")).write_text(
              hashlib.sha256(archive.read_bytes()).hexdigest() + "  " + archive.name + "\n", encoding="ascii")
          for wheel in pathlib.Path("embedded-wheels").glob("*.whl"):
              import shutil
              target = output / wheel.name
              shutil.copy2(wheel, target)
              (output / (wheel.name + ".sha256")).write_text(
                  hashlib.sha256(target.read_bytes()).hexdigest() + "  " + wheel.name + "\n", encoding="ascii")
          for package in pathlib.Path("node-packages").iterdir():
              import shutil
              shutil.copy2(package, output / package.name)
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  # Native linux/arm64 gate for the published arm64 images, whose Docker
  # cross-build skips the test suite (VLITE_IMAGE_TESTS=0) instead of running it under QEMU.
  linux-arm64:
    needs: identity
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo build --locked --release --bins --all-features
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r tests/requirements-grpc.txt
      - name: Verify release gRPC binary with generated protobuf client
        env:
          VLITE_SERVER_BIN: target/release/vlite-server
        run: python tests/grpc_smoke.py

  manylinux:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build audited portable Linux wheel
        run: docker build --file bindings/manylinux.Dockerfile --target artifacts --output type=local,dest=manylinux-wheels .
      - name: Verify in separate runtime without network
        run: |
          docker pull python:3.11-slim-bookworm
          docker run --rm --network none --mount type=bind,source=${{ github.workspace }},target=/repo,readonly --workdir /repo python:3.11-slim-bookworm python tests/embedded_wheel.py manylinux-wheels --platform-tag manylinux_2_28_x86_64
      - name: Add checksums
        shell: python
        run: |
          import hashlib, pathlib
          for wheel in pathlib.Path("manylinux-wheels").glob("*.whl"):
              wheel.with_name(wheel.name + ".sha256").write_text(
                  hashlib.sha256(wheel.read_bytes()).hexdigest() + "  " + wheel.name + "\n", encoding="ascii")
      - uses: actions/upload-artifact@v4
        with:
          name: native-manylinux-x86_64
          path: manylinux-wheels/*

  image-test:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: vlite-release:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: vlite-release:api-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard
          load: true
          tags: vlite-release:dashboard-test
      - name: Verify the legacy runtime entrypoint
        run: docker run --rm --network none --read-only --tmpfs /data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001 vlite-release:test
      - name: Test the exact API image without rebuilding
        env:
          VLITE_API_IMAGE: vlite-release:api-test
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/rest_e2e.py
      - name: Test HTTPS with the same API image
        env:
          VLITE_API_IMAGE: vlite-release:api-test
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/tls_e2e.py
      - name: Install dashboard browser test dependencies
        run: |
          python3 -m pip install -r tests/requirements-dashboard.txt
          python3 -m playwright install --with-deps chromium
      - name: Test browser UI with the exact standalone dashboard image
        env:
          VLITE_IMAGE: vlite-release:api-test
          VLITE_DASHBOARD_IMAGE: vlite-release:dashboard-test
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/dashboard_e2e.py

  image-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, linux-arm64, image-test, manylinux, clients]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.runtime.outputs.digest }}
      api_digest: ${{ steps.api.outputs.digest }}
      dashboard_digest: ${{ steps.dashboard.outputs.digest }}
      runtime_name: ${{ steps.name.outputs.runtime_image }}
      api_name: ${{ steps.name.outputs.api_image }}
      dashboard_name: ${{ steps.name.outputs.dashboard_image }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and derive lowercase registry name
        id: name
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "tag must match Cargo.toml version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
              output.write("runtime_image=" + image + "\n")
              output.write("api_image=" + image + "-api\n")
              output.write("dashboard_image=" + image + "-dashboard\n")
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: runtime
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: VLITE_IMAGE_TESTS=0
          push: true
          tags: ${{ steps.name.outputs.runtime_image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          target: api
          platforms: linux/amd64,linux/arm64
          build-args: VLITE_IMAGE_TESTS=0
          push: true
          tags: ${{ steps.name.outputs.api_image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=VLite REST API server
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v6
        id: dashboard
        with:
          context: .
          target: dashboard
          platforms: linux/amd64,linux/arm64
          build-args: VLITE_IMAGE_TESTS=0
          push: true
          tags: ${{ steps.name.outputs.dashboard_image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=VLite REST dashboard
          provenance: mode=max
          sbom: true

  image-verify:
    needs: image-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm published images contain both supported platforms
        env:
          VLITE_RUNTIME_IMAGE: ${{ needs.image-publish.outputs.runtime_name }}@${{ needs.image-publish.outputs.runtime_digest }}
          VLITE_API_IMAGE: ${{ needs.image-publish.outputs.api_name }}@${{ needs.image-publish.outputs.api_digest }}
          VLITE_DASHBOARD_IMAGE: ${{ needs.image-publish.outputs.dashboard_name }}@${{ needs.image-publish.outputs.dashboard_digest }}
        run: |
          set -euo pipefail
          for image in "$VLITE_RUNTIME_IMAGE" "$VLITE_API_IMAGE" "$VLITE_DASHBOARD_IMAGE"; do
            platforms="$(docker buildx imagetools inspect "$image")"
            grep -q 'linux/amd64' <<<"$platforms"
            grep -q 'linux/arm64' <<<"$platforms"
          done
      - name: Pull and verify the published digest without rebuilding
        env:
          VLITE_API_IMAGE: ${{ needs.image-publish.outputs.api_name }}@${{ needs.image-publish.outputs.api_digest }}
          VLITE_DASHBOARD_IMAGE: ${{ needs.image-publish.outputs.dashboard_name }}@${{ needs.image-publish.outputs.dashboard_digest }}
          VLITE_IMAGE: ${{ needs.image-publish.outputs.runtime_name }}@${{ needs.image-publish.outputs.runtime_digest }}
          VLITE_E2E_NO_BUILD: "1"
        run: |
          docker pull "$VLITE_API_IMAGE"
          docker pull "$VLITE_DASHBOARD_IMAGE"
          docker pull "$VLITE_IMAGE"
          docker run --rm --network none --read-only --tmpfs /data:rw,noexec,nosuid,size=64m,uid=10001,gid=10001 "$VLITE_IMAGE"
          python3 tests/rest_e2e.py
          python3 tests/tls_e2e.py
      - name: Install dashboard browser test dependencies
        run: |
          python3 -m pip install -r tests/requirements-dashboard.txt
          python3 -m playwright install --with-deps chromium
      - name: Verify browser UI against the published API and dashboard digests
        env:
          VLITE_IMAGE: ${{ needs.image-publish.outputs.api_name }}@${{ needs.image-publish.outputs.api_digest }}
          VLITE_DASHBOARD_IMAGE: ${{ needs.image-publish.outputs.dashboard_name }}@${{ needs.image-publish.outputs.dashboard_digest }}
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/dashboard_e2e.py

  release:
    needs: [image-publish, image-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify all payload checksums and record source identity
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          subprocess.run([sys.executable, "bindings/release_assets.py", "dist",
                          "--version", version, "--commit", os.environ["GITHUB_SHA"]], check=True)
      - name: Publish release with digest-pinned image and native checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_IMAGE: ${{ needs.image-publish.outputs.runtime_name }}
          RUNTIME_DIGEST: ${{ needs.image-publish.outputs.runtime_digest }}
          API_IMAGE: ${{ needs.image-publish.outputs.api_name }}
          API_DIGEST: ${{ needs.image-publish.outputs.api_digest }}
          DASHBOARD_IMAGE: ${{ needs.image-publish.outputs.dashboard_name }}
          DASHBOARD_DIGEST: ${{ needs.image-publish.outputs.dashboard_digest }}
        run: |
          printf '%s\n\n%s\n%s\n%s\n\n%s\n\n%s\n' "Container images (linux/amd64 and linux/arm64):" "- REST API: $API_IMAGE@$API_DIGEST" "- Dashboard: $DASHBOARD_IMAGE@$DASHBOARD_DIGEST" "- Smoke/maintenance tools (legacy entrypoint): $RUNTIME_IMAGE@$RUNTIME_DIGEST" "Download the matching SDK below. Installation and platform limits: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/INSTALL.md" "Verify SHA256SUMS before installing. Back up before upgrading; see the Docker upgrade and rollback procedure in docs/DOCKER-OPERATIONS.md. Packages are not published to PyPI/npm. Checksums are integrity checks, not signatures." > release-notes.txt
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "VLite $GITHUB_REF_NAME" --notes-file release-notes.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

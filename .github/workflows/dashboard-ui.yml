name: Dashboard UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/dashboard/**"
      - "src/openapi*.json"
      - "site/dashboard.html"
      - "site/about.html"
      - "site/assets/dashboard/**"
      - "site/assets/style.css"
      - "site/assets/site.js"
      - "docs/**"
      - "scripts/build_site_docs.py"
      - "site/assets/theme.css"
      - "site/assets/fonts/**"
      - "site/assets/vendor/three/**"
      - "src/server.rs"
      - "src/server/**"
      - "tests/*admin*"
      - "tests/*console*"
      - "tests/*navigation*"
      - "tests/dashboard*"
      - "tests/api_reference.py"
      - ".github/workflows/dashboard-ui.yml"
  pull_request:
    paths:
      - "src/dashboard/**"
      - "src/openapi*.json"
      - "site/dashboard.html"
      - "site/about.html"
      - "site/assets/dashboard/**"
      - "site/assets/style.css"
      - "site/assets/site.js"
      - "docs/**"
      - "scripts/build_site_docs.py"
      - "site/assets/theme.css"
      - "site/assets/fonts/**"
      - "site/assets/vendor/three/**"
      - "src/server.rs"
      - "src/server/**"
      - "tests/*admin*"
      - "tests/*console*"
      - "tests/*navigation*"
      - "tests/dashboard*"
      - "tests/api_reference.py"
      - ".github/workflows/dashboard-ui.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check dashboard helpers
        run: |
          node --test tests/console_tools.test.cjs tests/navigation.test.cjs tests/dashboard_interactions.test.cjs tests/admin_tools.test.cjs tests/dashboard_graph.test.cjs tests/dashboard_data.test.cjs
          python tests/admin_route_coverage.py
          python tests/dashboard_feature_coverage.py
      - run: python -m pip install -r tests/requirements-dashboard.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build documentation for the dashboard tour
        run: |
          python -m pip install markdown==3.7
          python scripts/build_site_docs.py site site/docs
      - name: Check browser workflows without a backend
        run: |
          python tests/dashboard_e2e.py --mocked
          python tests/admin_e2e.py
          python tests/dashboard_graph_ui.py
          python tests/dashboard_data_ui.py
          python tests/dashboard_tours.py site

  memory-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: dashboard-memory-mode-server
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --locked --features server --bin vlite-server
      - run: python -m pip install -r tests/requirements-dashboard.txt
      - run: python -m playwright install --with-deps chromium
      - name: Dashboard against a real server with agent memory enabled
        run: python tests/dashboard_memory_mode.py target/debug/vlite-server

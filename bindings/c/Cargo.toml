[package]
name = "vlite-ffi"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Versioned C ABI for the VLite embedded database"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vlite = { path = "../..", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

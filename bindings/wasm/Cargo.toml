[package]
name = "vlite-wasm"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "In-memory VLite for WebAssembly (wasm-bindgen)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vlite = { path = "../..", features = ["json"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[workspace]

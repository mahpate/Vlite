[package]
name = "vlite"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "A single-file vector database with embedded bindings and an optional REST service"
license = "MIT"

[workspace]
members = ["bindings/c"]
exclude = ["bindings/wasm"]
resolver = "3"

[features]
default = []
http-embedder = ["json", "dep:reqwest"]
otel = ["server", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
tools = ["json", "dep:csv"]
import-formats = ["tools", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:parquet"]
json = ["dep:serde", "dep:serde_json"]
mcp = ["json"]
server = ["json", "dep:axum", "dep:base64", "dep:tokio", "dep:subtle", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:tokio-stream", "dep:reqwest"]
grpc = [
    "server",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tonic-health",
    "dep:tonic-prost-build",
    "dep:protox",
]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["wgsl", "dx12", "metal", "vulkan"] }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
opentelemetry = { version = "0.31", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", optional = true, default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-roots"] }
csv = { version = "1.3", optional = true }
arrow-array = { version = "=56.2.0", optional = true }
arrow-schema = { version = "=56.2.0", optional = true }
arrow-ipc = { version = "=56.2.0", optional = true }
parquet = { version = "=56.2.0", optional = true, default-features = false, features = ["arrow", "snap"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = { version = "2", optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["net"] }
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport", "router", "server", "codegen", "tls-ring"] }
tonic-health = { version = "0.14", optional = true, default-features = false }
tonic-prost = { version = "0.14", optional = true }
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
tempfile = "3"
subtle = { version = "2.6", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
protox = { version = "0.10", optional = true }
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
http-body-util = "0.1"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vlite-server"
required-features = ["server"]

[[test]]
name = "rest"
required-features = ["server"]

[[test]]
name = "server_cli"
required-features = ["server"]

[[test]]
name = "grpc"
required-features = ["grpc"]

[[bin]]
name = "vlite-shell"
required-features = ["tools"]

[[bin]]
name = "vlite-import"
required-features = ["tools"]

[[bin]]
name = "vlite-tune"
required-features = ["tools"]

[[bin]]
name = "vlite-quality"
required-features = ["tools"]

[[bin]]
name = "vlite-mcp"
required-features = ["mcp"]

[[test]]
name = "mcp"
required-features = ["mcp"]

name: Build deployment API image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: deployment-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Require successful full CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py image-ci
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: .buildkit-cache
          key: api-cargo-v1-amd64-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            api-cargo-v1-amd64-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-
            docker-ci-v1-${{ runner.arch }}-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-${{ github.sha }}
            api-cargo-v1-amd64-
      - uses: reproducible-containers/buildkit-cache-dance@e475a9cbcb5052f85fd3830f1266fa0c91ef8595
        with:
          cache-map: |
            {
              ".buildkit-cache/registry": {"target": "/usr/local/cargo/registry", "sharing": "locked"},
              ".buildkit-cache/git": {"target": "/usr/local/cargo/git", "sharing": "locked"},
              ".buildkit-cache/target": {"target": "/app/target", "sharing": "locked"}
            }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable source tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish the CI-qualified API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            VLITE_IMAGE_TESTS=0
            VLITE_IMAGE_BINS=shipped
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,ignore-error=true,scope=api-amd64
          provenance: mode=max
          sbom: true
      - name: Record deployable digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Source: `%s`\n\nImage: `%s`\n\nDigest: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

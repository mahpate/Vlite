[package]
name = "vlite"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "A single-file vector database with embedded bindings and an optional REST service"
license = "MIT"

[workspace]
members = ["bindings/c"]
resolver = "3"

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
server = ["json", "dep:axum", "dep:base64", "dep:tokio", "dep:subtle", "dep:getrandom"]

[dependencies]
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = "3"
subtle = { version = "2.6", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "vlite-server"
required-features = ["server"]

[[test]]
name = "rest"
required-features = ["server"]

[[test]]
name = "server_cli"
required-features = ["server"]

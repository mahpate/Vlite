name: VLite CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: "Run the Docker job (the container test suite). Clear it for a quicker run; such a run cannot qualify a deployment image."
        type: boolean
        default: true
      test_proof:
        description: "Also list the tests to prove the Windows buckets are disjoint and complete and that Nextest lists the same tests as cargo test (a few extra minutes)."
        type: boolean
        default: false
      debuginfo:
        description: "Debug info of dev and test builds: line-tables-only (default, panic backtraces keep file and line), 0 (lighter still) or 2 (full, the old default)."
        type: choice
        options: [line-tables-only, "0", "2"]
        default: line-tables-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Dev and test builds write line tables instead of full debug info: much less to write and link
  # (the Windows suite links 155 test binaries), and a panic backtrace still names file and line.
  CARGO_PROFILE_DEV_DEBUG: ${{ inputs.debuginfo || 'line-tables-only' }}
  CARGO_PROFILE_TEST_DEBUG: ${{ inputs.debuginfo || 'line-tables-only' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.route.outputs.full }}
      docker: ${{ steps.route.outputs.docker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python tests/ci_workflows.py
      - run: python tests/mutant_replay_selftest.py
      - name: Verify compact precision, graph, temporal, filter, memory and ingestion golden oracles
        run: |
          python tests/compact_float16_oracle.py --self-test
          python tests/compact_ann_oracle.py --self-test
          python -O tests/compact_ann_oracle.py --self-test
          python tests/precision_catalog_oracle.py --self-test
          python tests/graph_algorithm_oracle.py --self-test
          python tests/graph_iteration_oracle.py --self-test
          python tests/graph_betweenness_oracle.py --self-test
          python tests/compact_graph_oracle.py --self-test
          python tests/compact_graph_overlay_oracle.py --self-test
          python tests/compact_graph_property_oracle.py --self-test
          python tests/compact_graph_label_oracle.py --self-test
          python tests/compact_graph_attachment_oracle.py --self-test
          python tests/compact_graph_schema_oracle.py --self-test
          python tests/compact_graph_import_oracle.py --self-test
          python tests/temporal_interval_oracle.py --self-test
          python tests/temporal_read_oracle.py --self-test
          python tests/filter_visibility_oracle.py --self-test
          python tests/memory_ranking_oracle.py --self-test
          python -O tests/memory_ranking_oracle.py --self-test
          python tests/agent_memory_oracle.py --self-test
          python -O tests/agent_memory_oracle.py --self-test
          python tests/c1_consolidation_oracle.py --self-test
          python -O tests/c1_consolidation_oracle.py --self-test
          python tests/memory_erasure_oracle.py --self-test
          python -O tests/memory_erasure_oracle.py --self-test
          python tests/memory_wire_oracle.py --self-test
          python -O tests/memory_wire_oracle.py --self-test
          python tests/memory_binding_record_oracle.py --self-test
          python -O tests/memory_binding_record_oracle.py --self-test
          python tests/ingestion_reference.py --self-test
          python -O tests/ingestion_reference.py --self-test
          python tests/ingestion_schema_reference.py --self-test
          python -O tests/ingestion_schema_reference.py --self-test
          python tests/graph_subset_oracle.py --self-test
          python -O tests/graph_subset_oracle.py --self-test
          python tests/graph_subset_write_oracle.py --self-test
          python -O tests/graph_subset_write_oracle.py --self-test
          python tests/lease_ledger_oracle.py --self-test
          python -O tests/lease_ledger_oracle.py --self-test
      - id: route
        env:
          CI_DOCKER_INPUT: ${{ inputs.docker }}
        run: python scripts/ci_policy.py route

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify documentation contracts
        run: |
          python tests/release_docs.py
          python tests/agent_docs.py
          python tests/content_budget.py
          python tests/api_reference.py
          python tests/compact_method_matrix.py
          python tests/api_route_inventory.py

      - name: Verify dashboard REST coverage on documentation-only changes
        run: python tests/dashboard_feature_coverage.py

  native:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        toolchain: ["1.89.0", stable]
    runs-on: ${{ matrix.os }}
    env:
      VLITE_REQUIRE_AVX2: ${{ (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/windows-fast-disk
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        if: matrix.os != 'windows-latest'
        with:
          tool: cargo-nextest@0.9.149
          fallback: none
      - run: cargo check --locked --no-default-features --lib
      # The Windows all-features suite runs in the sharded windows-tests job.
      - name: Test full feature suite with Nextest on Linux and macOS
        if: matrix.os != 'windows-latest'
        run: cargo nextest run --locked --workspace --all-targets --all-features
      - name: Prove Nextest lists the same tests as cargo test
        if: inputs.test_proof && matrix.os != 'windows-latest'
        run: python3 scripts/ci_test_proof.py parity -- --locked --workspace --all-targets --all-features
      # Nextest does not run doc tests (and --all-targets never did): this step keeps them.
      - name: Doc tests of every crate
        if: matrix.os != 'windows-latest'
        run: cargo test --locked --workspace --all-features --doc
      - name: Doc tests of vlite-graph
        if: matrix.os == 'windows-latest'
        run: cargo test --locked -p vlite-graph --doc
      - name: Graph CLI with json only (FOLLOWUP-001; without tools or server)
        run: cargo test --locked --features json --test graph_cli
      - name: Server without grpc or mcp (ITEM-027..030; catches cfg gaps hidden by --all-features)
        run: cargo test --locked --features server --test graph_server_surfaces --test rest_graph
      - name: Default features compile check on every other platform (the all-features suite already ran the tests there)
        if: matrix.os != 'ubuntu-latest' || matrix.toolchain != 'stable'
        run: cargo check --locked --workspace --all-targets
      - name: REG-008 served OpenAPI bytes and MCP tools/list/outputs match the baseline capture
        run: cargo test --locked --features server,mcp --test graph_surface_parity
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: REG-001 public API item list matches the baseline (additions under vlite::property_graph allowed, C-2)
        if: matrix.toolchain == 'stable'
        run: python scripts/api_surface.py check
      - name: Build optional gRPC server
        run: cargo build --locked --features grpc --bin vlite-server
      - name: Install protobuf smoke-test dependencies
        run: python -m pip install -r tests/requirements-grpc.txt
      - name: Verify generated gRPC client against real server
        run: python tests/grpc_smoke.py
      - run: cargo build --locked -p vlite-ffi
      - run: python tests/embedded_e2e.py target/debug/${{ runner.os == 'Windows' && 'vlite_ffi.dll' || runner.os == 'macOS' && 'libvlite_ffi.dylib' || 'libvlite_ffi.so' }}
      - name: Verify typed float32 embedded inputs and legacy fallback
        run: python bindings/python/test_typed_vectors.py
      - name: Default vlite-ffi serves graph commands (always compiled since v0.5.1; ITEM-046)
        run: python bindings/python/test_graph.py
        env:
          VLITE_TEST_EXPECT_GRAPH: "1"
      - name: Verify embedded key-value operations against the shared dialect goldens
        run: python bindings/python/test_kv.py
      - run: python benchmarks/embedded.py --library target/debug/${{ runner.os == 'Windows' && 'vlite_ffi.dll' || runner.os == 'macOS' && 'libvlite_ffi.dylib' || 'libvlite_ffi.so' }} --records 12 --dimensions 3 --trials 1 --read-passes 2 --output embedded-smoke.json
      - run: python tests/benchmark_comparison.py
      - run: python tests/native_campaign.py
      - run: python tests/embedded_benchmark.py
      - run: python tests/release_candidate.py
      - run: python tests/release_assets.py
      - run: python tests/wheel_platform.py
      - name: Verify advanced retrieval report contracts
        run: python tests/search_capabilities_campaign.py
      - name: Verify restart measurement contracts
        run: python tests/ann_restart_campaign.py
      - name: Verify container code-generation and workspace inputs
        run: python tests/docker_build_inputs.py
      - name: Verify Azure Container Apps mount probe
        run: python tests/azure_container_apps.py
      - name: Verify Azure Container Apps deployment guards
        if: matrix.os == 'windows-latest' && matrix.toolchain == 'stable'
        shell: pwsh
        run: .\deploy\azure-container-apps\test.ps1
      - name: Verify vlite-graph dependency boundary and artifact feature pins
        run: python tests/graph_build_boundary.py
      - name: Verify graph reference measurement runner
        run: python tests/graph_reference_runner.py
      - name: Verify bundled OpenAPI references and route parameters
        run: python tests/openapi_contract.py
      - name: Verify v4 collection, revision and import example
        run: cargo run --locked --example collections -- collections-example.vlite
      - run: cargo build --locked --release --bin vlite-bench
      - name: Verify offline embedding campaign and mutation provenance
        run: python tests/embedding_campaign.py --binary target/release/vlite-bench${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify filtered exact top-k benchmark
        run: cargo run --locked --release --bin vlite-bench -- --filter-every 10 1024 8 10 64 10 42
      - name: Measure exact/HNSW benchmark and process peak memory
        run: python tests/measure_benchmark.py target/release/vlite-bench${{ runner.os == 'Windows' && '.exe' || '' }} --ann 16 100 100 256 8 10 64 5 42
      - name: Verify mixed-update campaign and measured peak memory
        run: python benchmarks/native_campaign.py --binary target/release/vlite-bench${{ runner.os == 'Windows' && '.exe' || '' }} --records 300 --dimensions 8 --queries 10 --trials 1 --ef 32 --mixed-writes 32 --output native-campaign.json
      - name: Verify mixed-load exact/ANN correctness during background maintenance
        run: cargo run --locked --release --features json --example maintenance_mixed_load -- maintenance-mixed-load.json
      - name: Verify exact-metric and cosine ANN campaign
        run: python benchmarks/metric_campaign.py --binary target/release/vlite-bench${{ runner.os == 'Windows' && '.exe' || '' }} --records 32 --dimensions 8 --queries 2 --trials 1 --output metric-campaign.json
      - name: Build advanced retrieval measurement example
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: cargo build --locked --release --example search_capabilities_bench
      - name: Measure indexed and quantized retrieval with independent oracle
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: python benchmarks/search_capabilities_campaign.py --binary target/release/examples/search_capabilities_bench --output search-capabilities.json
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        with:
          name: search-capabilities-measurements
          path: search-capabilities.json

  # The Windows all-features suite is the longest test run (about 3,900 tests, two at a time), so it is
  # split into three hash buckets, each on its own runner. Every test lands in exactly one bucket, so the
  # three jobs together run what the single job ran. The other native steps stay in `native`, once per toolchain.
  windows-tests:
    name: windows-tests (${{ matrix.toolchain }}, shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.89.0", stable]
        shard: [1, 2, 3]
    runs-on: windows-latest
    env:
      VLITE_REQUIRE_AVX2: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/windows-fast-disk
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-latest-${{ matrix.toolchain }}
          save-if: ${{ github.event_name != 'pull_request' && matrix.shard == 1 }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037
        with:
          tool: cargo-nextest@0.9.149
          fallback: none
      - name: Test one third of the full feature suite with bounded Nextest
        run: cargo nextest run --locked --workspace --all-targets --all-features --test-threads 2 --partition hash:${{ matrix.shard }}/3
      - name: Prove the buckets are disjoint and complete
        if: inputs.test_proof && matrix.shard == 1
        run: python scripts/ci_test_proof.py shards 3 -- --locked --workspace --all-targets --all-features

  clients:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/windows-fast-disk
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify dashboard console helpers
        if: matrix.os == 'ubuntu-latest'
        run: |
          node --test tests/console_tools.test.cjs tests/admin_tools.test.cjs tests/navigation.test.cjs tests/dashboard_interactions.test.cjs tests/dashboard_graph.test.cjs
          python tests/admin_route_coverage.py
          python tests/dashboard_feature_coverage.py
      - name: Verify the website API reference documents every public API item
        if: matrix.os == 'ubuntu-latest'
        run: |
          python tests/api_reference.py
          python tests/api_route_inventory.py
      - name: Verify the opt-in dev-fast environment scripts (sets variables only; no cargo build)
        run: python tests/dev_fast_env.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: clients-${{ matrix.os }}
          workspaces: |
            . -> target
            . -> target/node-default
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: python -m unittest discover -s clients/python -p test_client.py
      - run: python -m pip wheel --no-deps --wheel-dir client-dist ./clients/python
      - run: python bindings/build_wheel.py --target-dir target/node-default --output embedded-wheels
      - run: python tests/embedded_wheel.py embedded-wheels
      - name: Assemble verified local candidate
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path("embedded-wheels").glob("*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "bindings/release_candidate.py", "--wheel",
                          str(wheels[0]), "--output", "embedded-wheels/candidate.zip"], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-wheel-${{ runner.os }}-${{ runner.arch }}
          path: |
            embedded-wheels/*.whl
            embedded-wheels/candidate.zip
      - run: npm --prefix clients/javascript ci --ignore-scripts
      - run: npm --prefix clients/javascript test
      - run: npm --prefix clients/javascript run typecheck
      - run: npm --prefix bindings/node ci --ignore-scripts
      - run: npm --prefix bindings/node run build
      - run: npm --prefix bindings/node test
        env:
          VLITE_TEST_EXPECT_GRAPH: "1"
      - name: Default vlite-ffi serves Node graph methods (always compiled since v0.5.1; ITEM-047)
        working-directory: bindings/node
        run: |
          cargo build --locked --release -p vlite-ffi --target-dir ../../target/node-default
          node --test graph.test.mjs
        env:
          VLITE_TEST_EXPECT_GRAPH: "1"
          VLITE_TEST_LIBRARY: ${{ github.workspace }}/target/node-default/release/${{ runner.os == 'Windows' && 'vlite_ffi.dll' || runner.os == 'macOS' && 'libvlite_ffi.dylib' || 'libvlite_ffi.so' }}
      - run: npm --prefix bindings/node run typecheck
      - run: node bindings/node/pack.mjs node-packages
      - name: Verify offline installed Node package
        shell: python
        run: |
          import pathlib, subprocess
          packages = list(pathlib.Path("node-packages").glob("*.tgz"))
          assert len(packages) == 1
          subprocess.run(["node", "tests/node_package.mjs", str(packages[0])], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-node-${{ runner.os }}-${{ runner.arch }}
          path: node-packages/*
      - run: cargo build --locked --features server --bin vlite-server
      - run: python tests/clients_e2e.py target/debug/vlite-server${{ runner.os == 'Windows' && '.exe' || '' }}

  manylinux:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and audit glibc 2.28 x86_64 wheel
        run: docker build --file bindings/manylinux.Dockerfile --target artifacts --output type=local,dest=manylinux-wheels .
      - name: Verify installation in a separate Linux runtime
        run: |
          docker pull python:3.11-slim-bookworm
          docker run --rm --network none --mount type=bind,source=${{ github.workspace }},target=/repo,readonly --workdir /repo python:3.11-slim-bookworm python tests/embedded_wheel.py manylinux-wheels --platform-tag manylinux_2_28_x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-wheel-manylinux-x86_64
          path: manylinux-wheels/*.whl

  node-linux-package:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify embedded Node package in clean offline runtime
        run: docker build --file bindings/node/Dockerfile --target artifacts --output type=local,dest=node-linux-packages .

  lint:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    # Playwright does not support the Ubuntu 26.04 image behind ubuntu-latest.
    runs-on: ubuntu-24.04
    env:
      VLITE_IMAGE_TESTS: "0" # The tests target below always runs the full suite.
      VLITE_IMAGE_BINS: shipped
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: .buildkit-cache
          key: docker-ci-v2-release-${{ runner.arch }}-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            docker-ci-v2-release-${{ runner.arch }}-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-
            docker-ci-v2-release-${{ runner.arch }}-
      - uses: reproducible-containers/buildkit-cache-dance@e475a9cbcb5052f85fd3830f1266fa0c91ef8595
        with:
          cache-map: |
            {
              ".buildkit-cache/registry": {"target": "/usr/local/cargo/registry", "sharing": "locked"},
              ".buildkit-cache/git": {"target": "/usr/local/cargo/git", "sharing": "locked"},
              ".buildkit-cache/release": {"target": "/app/target/release", "sharing": "locked"}
            }
      - run: docker compose --profile test run --build --rm tests
      - name: Verify persistent smoke and maintenance
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --build --rm vlite
          docker compose run --rm vlite
          docker compose run --rm --entrypoint vlite-maintain vlite inspect /data/smoke.vlite
          docker compose run --rm --entrypoint vlite-maintain vlite backup /data/smoke.vlite /data/backup.vlite
          docker compose run --rm --entrypoint vlite-maintain vlite restore /data/backup.vlite /data/restored.vlite
          docker compose run --rm --entrypoint vlite-maintain vlite compact /data/restored.vlite /data/compact.vlite
          docker compose run --rm vlite verify /data/compact.vlite
          docker compose run --rm --entrypoint vlite-bench vlite 64 8 8 16 5 42
          docker compose run --rm --entrypoint vlite-bench vlite --ann 16 100 100 256 8 10 64 5 42
      - name: Verify REST over HTTP and persistent container restart
        run: python3 tests/rest_e2e.py
      - name: Verify authenticated HTTPS reverse proxy
        run: python3 tests/tls_e2e.py
      - name: Install dashboard browser test dependencies
        run: |
          python3 -m pip install -r tests/requirements-dashboard.txt
          python3 -m playwright install --with-deps chromium
      - name: Build standalone dashboard image
        run: docker build --target dashboard --tag vlite-dashboard-ui:test .
      - name: Verify dashboard with Chromium against Docker
        env:
          VLITE_IMAGE: vlite-smoke:local
          VLITE_DASHBOARD_IMAGE: vlite-dashboard-ui:test
          VLITE_E2E_NO_BUILD: "1"
        run: python3 tests/dashboard_e2e.py


  go-client:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Go unit tests and static checks
        working-directory: clients/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: go-server
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --locked --features server --bin vlite-server
      - name: Go opt-in REST e2e against disposable server
        run: python clients/go/live_test.py go

  dotnet-client:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build .NET client and package-free tests
        run: dotnet build clients/dotnet/VLite.Client.Tests --configuration Release --nologo
      - name: Run fake HTTP handler tests
        run: dotnet run --project clients/dotnet/VLite.Client.Tests --configuration Release --no-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: dotnet-server
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --locked --features server --bin vlite-server
      - name: .NET opt-in REST e2e against disposable server
        run: python clients/go/live_test.py dotnet

  python-integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: [none, integrations]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependency-free client
        if: matrix.extras == 'none'
        run: python -m pip install ./clients/python
      - name: Install real framework extras
        if: matrix.extras == 'integrations'
        run: python -m pip install './clients/python[integrations]'
      - name: Adapter fake tests and optional real-package tests
        run: python -m unittest discover -s clients/python/vlite_client/integrations -p test_integrations.py -v

  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: helm lint deploy/helm/vlite --set auth.existingSecret=vlite-auth
      - run: helm template vectors deploy/helm/vlite --set auth.existingSecret=vlite-auth
      - name: Validate managed auth Secret and optional TLS mount
        run: helm template vectors deploy/helm/vlite --set auth.token=abcdefghijklmnopqrstuvwxyz012345 --set tls.existingSecret=vlite-tls

  wasm:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: wasm
          workspaces: |
            . -> target
            bindings/wasm -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --lib
      - name: Build and run the WebAssembly package in Node
        working-directory: bindings/wasm
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build --locked --release --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/release/vlite_wasm.wasm --target nodejs --out-dir pkg
          node test/smoke.mjs pkg/vlite_wasm.js

  # The default-feature suite (graph is always compiled; it includes graph_regression and graph_compat)
  # does not depend on the all-features suite, so it runs next to it instead of after it in `native`
  # (about ten minutes of the longest job). It keeps `cargo test`, as before, on Linux stable.
  default-features:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      VLITE_REQUIRE_AVX2: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ubuntu-latest-stable
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Default features suite (graph always compiled since v0.5.1; includes graph_regression and graph_compat)
        run: cargo test --locked --workspace --all-targets

  required:
    name: CI required
    if: always()
    needs: [changes, documentation, native, default-features, windows-tests, clients, manylinux, node-linux-package, lint, docker, go-client, dotnet-client, python-integrations, helm-chart, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          outputs = jobs["changes"]["outputs"]
          full, docker = outputs.get("full"), outputs.get("docker")
          assert full in ("true", "false"), "Change routing did not complete"
          assert docker in ("true", "false"), "Docker routing did not complete"
          assert full == "true" or docker == "false", "The Docker job cannot run without the full matrix"
          always = {"changes", "documentation", "clients", "python-integrations", "helm-chart"}
          for name, job in jobs.items():
              applies = name in always or (docker if name == "docker" else full) == "true"
              expected = {"success"} if applies else {"skipped"}
              assert job["result"] in expected, f"{name}: {job['result']} (expected {expected})"

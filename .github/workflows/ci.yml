name: VLite CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.89.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo check --locked --no-default-features --lib
      - run: cargo test --locked --all-targets --all-features
      - run: python tests/benchmark_comparison.py
      - run: cargo build --locked --release --bin vlite-bench
      - name: Verify filtered exact top-k benchmark
        run: cargo run --locked --release --bin vlite-bench -- --filter-every 10 1024 8 10 64 10 42
      - name: Measure exact/HNSW benchmark and process peak memory
        run: python tests/measure_benchmark.py target/release/vlite-bench${{ runner.os == 'Windows' && '.exe' || '' }} --ann 16 100 100 256 8 10 64 5 42

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --profile test run --build --rm tests
      - name: Verify persistent smoke and maintenance
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --build --rm vlite
          docker compose run --rm vlite
          docker compose run --rm --entrypoint vlite-maintain vlite inspect /data/smoke.vlite
          docker compose run --rm --entrypoint vlite-maintain vlite backup /data/smoke.vlite /data/backup.vlite
          docker compose run --rm --entrypoint vlite-maintain vlite restore /data/backup.vlite /data/restored.vlite
          docker compose run --rm --entrypoint vlite-maintain vlite compact /data/restored.vlite /data/compact.vlite
          docker compose run --rm vlite verify /data/compact.vlite
          docker compose run --rm --entrypoint vlite-bench vlite 64 8 8 16 5 42
          docker compose run --rm --entrypoint vlite-bench vlite --ann 16 100 100 256 8 10 64 5 42
      - name: Verify REST over HTTP and persistent container restart
        run: python3 tests/rest_e2e.py
      - name: Verify authenticated HTTPS reverse proxy
        run: python3 tests/tls_e2e.py

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vlite-embedded"
version = "0.4.0"
requires-python = ">=3.11"
description = "In-process Python binding for the VLite native database library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://mahpate.github.io/Vlite/"
Documentation = "https://mahpate.github.io/Vlite/api.html"
Repository = "https://github.com/mahpate/Vlite"
Issues = "https://github.com/mahpate/Vlite/issues"

[tool.setuptools.package-data]
vlite_embedded = ["py.typed"]

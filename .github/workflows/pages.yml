name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build_site_docs.py"
      - "tests/site_links.py"
      - "tests/release_docs.py"
      - "README.md"
      - "bindings/**/README.md"
      - "clients/**/README.md"
      - "benchmarks/results/engines-*.json"
      - "benchmarks/results/zvec-*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install markdown==3.7
      - name: Assemble site
        run: |
          mkdir -p _site/results
          cp -R site/. _site/
          cp benchmarks/results/zvec-*.json _site/results/
          for f in benchmarks/results/engines-*.json; do [ -e "$f" ] && cp "$f" _site/results/; done
          python scripts/build_site_docs.py site _site/docs
          touch _site/.nojekyll
      - name: Check site links and fragments
        run: |
          python tests/site_links.py _site
          python tests/release_docs.py
      - name: Check diagrams and dashboard tour
        run: |
          python -m pip install -r tests/requirements-dashboard.txt
          python -m playwright install --with-deps chromium
          python tests/site_diagrams.py _site
          python tests/dashboard_tours.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build deployment API image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive immutable source tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Test, build and publish the API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            VLITE_IMAGE_BINS=shipped
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,ignore-error=true,scope=api-amd64
          provenance: mode=max
          sbom: true
      - name: Record deployable digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Source: `%s`\n\nImage: `%s`\n\nDigest: `%s`\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

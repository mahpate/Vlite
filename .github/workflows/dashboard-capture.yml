name: Capture connected dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements-dashboard.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_connected_dashboard.py captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-dashboard
          path: captures/

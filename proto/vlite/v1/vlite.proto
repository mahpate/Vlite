// VLite gRPC API v1. Opt-in transport (`--grpc-bind`, Cargo feature `grpc`)
// over the same engine, authentication, scopes and limits as REST.
//
// Authentication: send `authorization: Bearer <token>` metadata (admin,
// read-only or scoped `vlk_` credential), exactly as for REST.
// Errors: the gRPC status message is the REST error message and the
// `vlite-error-code` trailer carries the stable REST error code.
// Addressing: an empty `collection` field addresses the legacy `default`
// collection with legacy defaults (the REST `/v1/...` routes); a non-empty
// value addresses that named collection (`/v1/collections/{collection}/...`).
// Limits: requests are capped at 8 MiB and responses at 16 MiB.
syntax = "proto3";

package vlite.v1;

service VLite {
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc GetCollection(GetCollectionRequest) returns (Collection);
  rpc CreateCollection(CreateCollectionRequest) returns (Collection);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc GetVector(GetVectorRequest) returns (Vector);
  rpc PutVector(PutVectorRequest) returns (PutVectorResponse);
  rpc DeleteVector(DeleteVectorRequest) returns (DeleteVectorResponse);
  // Atomic: every operation commits, or none does.
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);
  // Exact or ready-index ANN search. Never builds an index.
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc UpdateMetadata(UpdateMetadataRequest) returns (UpdateMetadataResponse);
  rpc SearchGrouped(GroupedSearchRequest) returns (GroupedSearchResponse);
  rpc Recommend(RecommendRequest) returns (SearchResponse);
  rpc Facets(FacetsRequest) returns (FacetsResponse);
  rpc NumericStats(NumericStatsRequest) returns (NumericStatsResponse);
  rpc GeoSearch(GeoSearchRequest) returns (GeoSearchResponse);
  rpc ConfigureNamedVector(ConfigureNamedVectorRequest) returns (Empty);
  rpc PutNamedVectors(PutNamedVectorsRequest) returns (Empty);
  rpc PutVectorVersion(PutVectorVersionRequest) returns (Empty);
  rpc SearchNamed(SearchNamedRequest) returns (SearchResponse);
  rpc SearchSparse(SearchSparseRequest) returns (SearchResponse);
  rpc SearchDenseSparse(SearchDenseSparseRequest) returns (SearchResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Changes(ChangesRequest) returns (ChangesResponse);
  rpc WatchChanges(WatchChangesRequest) returns (stream ChangesResponse);
  rpc BuildDiskAnn(BuildDiskAnnRequest) returns (DiskAnnBuildResponse);
  rpc SearchDiskAnn(SearchDiskAnnRequest) returns (SearchResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc ReserveImport(ReserveImportRequest) returns (ImportJsonResponse);
  rpc GetImportStatus(ImportJobRequest) returns (ImportJsonResponse);
  rpc ImportChunk(ImportChunkRequest) returns (ImportJsonResponse);
  rpc FinishImport(ImportJobRequest) returns (ImportJsonResponse);
  rpc AbortImport(ImportJobRequest) returns (ImportJsonResponse);
  // Streams records in ascending id order, one Vector per message. Each
  // page is read atomically; writes between pages may or may not be seen.
  // Resume after a broken stream with `after` = last id received.
  rpc ExportVectors(ExportVectorsRequest) returns (stream Vector);
  // Applies a client stream of ImportChunk-equivalent messages to one
  // reserved job, in order, each chunk committed durably as it arrives.
  // On any error or disconnect the job stays open: resume from
  // GetImportStatus.last_chunk + 1 (replaying the last chunk is idempotent).
  rpc StreamImport(stream StreamImportRequest) returns (ImportJsonResponse);
}

message Collection {
  uint32 id = 1;
  string name = 2;
  uint32 dimensions = 3;
  uint64 live_records = 4;
  // Effective settings as the same JSON object REST returns in `settings`.
  string settings_json = 5;
  bool settings_persisted = 6;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated Collection items = 1;
  uint32 format_version = 2;
}

message GetCollectionRequest {
  string name = 1;
}

message CreateCollectionRequest {
  string name = 1;
  uint32 dimensions = 2;
  // Optional partial settings: the same JSON object as REST `settings`.
  optional string settings_json = 3;
}

message DropCollectionRequest {
  string name = 1;
}

message DropCollectionResponse {
  bool deleted = 1;
}

message GeoPoint { double latitude = 1; double longitude = 2; }

message MetadataValue {
  oneof kind {
    string string_value = 1;
    int64 integer_value = 2;
    double float_value = 3;
    bool boolean_value = 4;
    GeoPoint geo_point = 5;
  }
}

// Compare-and-set precondition, checked atomically with the write (under the
// same database lock) against the addressed record of the addressed
// collection. Unset means `any`.
message Expected {
  message Any {}
  message Absent {}
  oneof kind {
    Any any = 1;
    // The ID must not currently exist.
    Absent absent = 2;
    // The record must exist with exactly this revision.
    uint64 revision = 3;
  }
}

message GetVectorRequest {
  string collection = 1;
  uint64 id = 2;
}

message Vector {
  uint64 id = 1;
  repeated float vector = 2;
  bytes payload = 3;
  map<string, MetadataValue> metadata = 4;
  uint64 revision = 5;
  optional uint64 expires_at_ms = 6;
}

message PutVectorRequest {
  string collection = 1;
  uint64 id = 2;
  repeated float vector = 3;
  bytes payload = 4;
  map<string, MetadataValue> metadata = 5;
  Expected expected = 6;
  // Optional absolute Unix-millisecond expiry; requires format V5.
  optional uint64 expires_at_ms = 7;
}

message PutVectorResponse {
  uint64 revision = 1;
  bool created = 2;
  optional uint64 expires_at_ms = 3;
}

message DeleteVectorRequest {
  string collection = 1;
  uint64 id = 2;
  Expected expected = 3;
}

message DeleteVectorResponse {
  bool deleted = 1;
}

message Operation {
  message Put {
    uint64 id = 1;
    repeated float vector = 2;
    bytes payload = 3;
    map<string, MetadataValue> metadata = 4;
  }
  message Delete {
    uint64 id = 1;
  }
  oneof kind {
    Put put = 1;
    Delete delete = 2;
  }
}

message WriteBatchRequest {
  string collection = 1;
  repeated Operation operations = 2;
}

message WriteBatchResponse {}

enum SearchMode {
  // Same as EXACT.
  SEARCH_MODE_UNSPECIFIED = 0;
  SEARCH_MODE_EXACT = 1;
  // Uses an existing matching index; FAILED_PRECONDITION `index_not_ready`
  // otherwise. Build indexes with REST `POST .../index/hnsw`.
  SEARCH_MODE_APPROXIMATE_READY = 2;
  // Fuses vector and text results using reciprocal-rank fusion.
  SEARCH_MODE_HYBRID = 3;
}

enum Metric {
  // The collection default (legacy target: squared_l2).
  METRIC_UNSPECIFIED = 0;
  METRIC_SQUARED_L2 = 1;
  METRIC_COSINE = 2;
  METRIC_INNER_PRODUCT = 3;
}

enum Quantization {
  // The collection default (legacy target: none).
  QUANTIZATION_UNSPECIFIED = 0;
  QUANTIZATION_NONE = 1;
  QUANTIZATION_SCALAR_U8 = 2;
}

// Index identity override; omitted fields use the default identity.
message HnswConfig {
  optional uint32 m = 1;
  optional uint32 ef_construction = 2;
  optional uint64 seed = 3;
}

message Condition {
  message Eq {
    string field = 1;
    MetadataValue value = 2;
  }
  message Range {
    string field = 1;
    MetadataValue min = 2;
    MetadataValue max = 3;
  }
  message GeoRadius { string field = 1; double latitude = 2; double longitude = 3; double radius_meters = 4; }
  oneof kind {
    Eq eq = 1;
    Range range = 2;
    GeoRadius geo_radius = 3;
  }
}

message SearchRequest {
  string collection = 1;
  repeated float vector = 2;
  uint32 k = 3;
  SearchMode mode = 4;
  Metric metric = 5;
  HnswConfig config = 6;
  optional uint32 ef_search = 7;
  Quantization quantization = 8;
  optional uint32 rerank_multiplier = 9;
  // Conjunction of metadata conditions.
  repeated Condition filter = 10;
  // Hybrid-only text query. Set vector_enabled=false for text-only retrieval.
  optional string text = 11;
  bool vector_enabled = 12;
  FusionOptions fusion = 13;
  HybridVectorLeg vector_leg = 14;
  // Optional post-ranking over exact candidates returned by this query.
  RerankMode rerank_mode = 15;
  optional double mmr_lambda = 16;
  optional uint32 rerank_candidates = 17;
}

message Hit {
  uint64 id = 1;
  double distance = 2;
}

enum HybridVectorLeg {
  HYBRID_VECTOR_LEG_EXACT = 0;
  HYBRID_VECTOR_LEG_APPROXIMATE_READY = 1;
}

message FusionOptions {
  optional uint32 candidates = 1;
  optional uint32 rrf_k = 2;
  optional double vector_weight = 3;
  optional double text_weight = 4;
}

message HybridHit {
  uint64 id = 1;
  double score = 2;
  optional double distance = 3;
  optional double bm25 = 4;
  optional uint32 vector_rank = 5;
  optional uint32 text_rank = 6;
}

message SearchResponse {
  repeated Hit hits = 1;
  repeated HybridHit hybrid_hits = 2;
}

// Successful import responses contain the same JSON shape as REST, preserving
// string-encoded job IDs. Rejected chunks return INVALID_ARGUMENT; the
// `vlite-error-details-base64` trailer contains base64-encoded UTF-8 JSON with
// the REST chunk response, including bounded per-row validation details.
message ImportJsonResponse {
  string json = 1;
}

message ReserveImportRequest {
  string collection = 1;
}

message ImportJobRequest {
  uint64 job = 1;
}

enum ImportPolicy {
  IMPORT_POLICY_REJECT_CHUNK = 0;
  IMPORT_POLICY_SKIP_INVALID = 1;
}

message ImportChunkRequest {
  uint64 job = 1;
  uint64 chunk = 2;
  repeated Operation operations = 3;
  ImportPolicy policy = 4;
}

message ExportVectorsRequest {
  string collection = 1;
  // Export ids strictly greater than this value; unset starts at the lowest id.
  optional uint64 after = 2;
  // Records read per atomic page, 1..1000; 0 means 256.
  uint32 page_size = 3;
}

// Every message names the same job. `chunk` 0 with no operations is allowed
// only together with `finish`, which must be on the last message and
// finishes the job after its chunk (if any) commits. The response is the
// final job status (or the finish result).
message StreamImportRequest {
  uint64 job = 1;
  uint64 chunk = 2;
  repeated Operation operations = 3;
  ImportPolicy policy = 4;
  bool finish = 5;
}


message Empty {}

message UpdateMetadataRequest {
  string collection = 1;
  uint64 id = 2;
  map<string, MetadataValue> metadata = 3;
}
message UpdateMetadataResponse { uint64 revision = 1; }

enum RerankMode {
  RERANK_MODE_NONE = 0;
  RERANK_MODE_EXACT = 1;
  RERANK_MODE_MMR = 2;
}
message GroupedSearchRequest {
  string collection = 1;
  repeated float vector = 2;
  uint32 groups = 3;
  uint32 hits_per_group = 4;
  string field = 5;
  repeated Condition filter = 6;
  Metric metric = 7;
}
message SearchGroup { MetadataValue value = 1; repeated Hit hits = 2; }
message GroupedSearchResponse { repeated SearchGroup groups = 1; }
message RecommendRequest {
  string collection = 1;
  repeated uint64 positive_ids = 2;
  repeated uint64 negative_ids = 3;
  repeated VectorInput positive_vectors = 4;
  repeated VectorInput negative_vectors = 5;
  uint32 k = 6;
  repeated Condition filter = 7;
  Metric metric = 8;
}
message VectorInput { repeated float vector = 1; }
message FacetsRequest { string collection = 1; string field = 2; repeated Condition filter = 3; }
message Facet { MetadataValue value = 1; uint64 count = 2; }
message FacetsResponse { repeated Facet facets = 1; }
message NumericStatsRequest { string collection = 1; string field = 2; repeated Condition filter = 3; }
message NumericStatsResponse {
  uint64 count = 1;
  optional double min = 2;
  optional double max = 3;
  double sum = 4;
  optional double average = 5;
}
enum GeoSort { GEO_SORT_VECTOR_DISTANCE = 0; GEO_SORT_GEOGRAPHIC_DISTANCE = 1; }
message GeoSearchRequest {
  string collection = 1;
  repeated float vector = 2;
  uint32 k = 3;
  string field = 4;
  double latitude = 5;
  double longitude = 6;
  double radius_meters = 7;
  repeated Condition filter = 8;
  Metric metric = 9;
  GeoSort sort = 10;
}
message GeoHit { uint64 id = 1; double vector_distance = 2; double geo_distance_meters = 3; }
message GeoSearchResponse { repeated GeoHit hits = 1; }
message NamedVectorSpec {
  string name = 1;
  uint32 dimensions = 2;
  Metric metric = 3;
  string active_version = 4;
  uint32 history = 5;
}
message ConfigureNamedVectorRequest { string collection = 1; NamedVectorSpec spec = 2; }
message NamedVector { string name = 1; string version = 2; repeated float vector = 3; }
message SparseVector { string name = 1; repeated uint32 indices = 2; repeated float values = 3; }
message PutNamedVectorsRequest {
  string collection = 1;
  uint64 id = 2;
  repeated NamedVector dense = 3;
  repeated SparseVector sparse = 4;
}
message PutVectorVersionRequest {
  string collection = 1;
  uint64 id = 2;
  string name = 3;
  string version = 4;
  repeated float vector = 5;
}
message SearchNamedRequest {
  string collection = 1;
  string name = 2;
  optional string version = 3;
  repeated float vector = 4;
  uint32 k = 5;
}
message SearchSparseRequest {
  string collection = 1;
  string name = 2;
  repeated uint32 indices = 3;
  repeated float values = 4;
  uint32 k = 5;
}
message SearchDenseSparseRequest {
  string collection = 1;
  string dense_name = 2;
  optional string version = 3;
  repeated float dense = 4;
  string sparse_name = 5;
  repeated uint32 sparse_indices = 6;
  repeated float sparse_values = 7;
  uint32 k = 8;
  FusionOptions fusion = 9;
}
message QueryRequest { string collection = 1; string query = 2; map<string, VectorInput> parameters = 3; }
message QueryResponse { repeated Hit hits = 1; repeated SearchGroup groups = 2; repeated Facet facets = 3; }
message ChangesRequest { string cursor = 1; uint32 limit = 2; }
message WatchChangesRequest { string cursor = 1; uint32 limit = 2; uint32 poll_interval_ms = 3; }
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_PUT = 1;
  CHANGE_KIND_DELETE = 2;
  CHANGE_KIND_METADATA_UPDATE = 3;
  CHANGE_KIND_COLLECTION_CREATED = 4;
  CHANGE_KIND_COLLECTION_DROPPED = 5;
  CHANGE_KIND_SETTINGS_UPDATED = 6;
  CHANGE_KIND_VECTORS_UPDATED = 7;
  // Graph-enabled files (v0.6.0). Graph events have an empty `collection`
  // and set `graph`; a batch also sets `revision` and `graph_operations`.
  CHANGE_KIND_GRAPH_CREATED = 8;
  CHANGE_KIND_GRAPH_DROPPED = 9;
  CHANGE_KIND_GRAPH_BATCH = 10;
}
enum GraphChangeOp {
  GRAPH_CHANGE_OP_UNSPECIFIED = 0;
  GRAPH_CHANGE_OP_NODE_UPSERTED = 1;
  GRAPH_CHANGE_OP_NODE_PATCHED = 2;
  GRAPH_CHANGE_OP_NODE_DELETED = 3;
  GRAPH_CHANGE_OP_EDGE_UPSERTED = 4;
  GRAPH_CHANGE_OP_EDGE_PATCHED = 5;
  GRAPH_CHANGE_OP_EDGE_DELETED = 6;
  GRAPH_CHANGE_OP_ATTACHED = 7;
  GRAPH_CHANGE_OP_DETACHED = 8;
  GRAPH_CHANGE_OP_SCHEMA_UPDATED = 9;
}
// One operation of a CHANGE_KIND_GRAPH_BATCH event. Fields not used by `op`
// are empty. `id`/`key` name the node or edge; attach/detach use `node`,
// `node_key`, `collection` and `record`.
message GraphChangeOperation {
  GraphChangeOp op = 1;
  optional uint64 id = 2;
  optional string key = 3;
  repeated string labels = 4;
  repeated string remove_labels = 5;
  map<string, MetadataValue> properties = 6;
  repeated string unset = 7;
  bool created = 8;
  optional uint64 source = 9;
  string source_key = 10;
  string relationship = 11;
  optional uint64 destination = 12;
  string destination_key = 13;
  optional uint64 node = 14;
  string node_key = 15;
  string collection = 16;
  optional uint64 record = 17;
  // Declared schema JSON (the REST `PUT /v1/graphs/{graph}/schema` shape).
  string schema_json = 18;
}
message ChangeEvent {
  uint64 sequence = 1;
  uint32 ordinal = 2;
  string collection = 3;
  optional uint64 committed_at_ms = 4;
  ChangeKind kind = 5;
  optional uint64 id = 6;
  optional uint64 expires_at_ms = 7;
  repeated float vector = 8;
  bytes payload = 9;
  map<string, MetadataValue> metadata = 10;
  optional uint32 dimensions = 11;
  string settings_json = 12;
  string graph = 13;
  optional uint64 revision = 14;
  repeated GraphChangeOperation graph_operations = 15;
}
message ChangesResponse {
  string cursor = 1;
  bool has_more = 2;
  uint64 head = 3;
  repeated ChangeEvent changes = 4;
}
message BuildDiskAnnRequest {
  string collection = 1;
  string path = 2;
  HnswConfig config = 3;
  Metric metric = 4;
}
message DiskAnnBuildResponse {
  uint64 lineage = 1;
  uint64 sequence = 2;
  uint32 collection_id = 3;
  uint64 live_records = 4;
}
message SearchDiskAnnRequest {
  string collection = 1;
  string path = 2;
  repeated float vector = 3;
  uint32 k = 4;
  uint32 ef_search = 5;
  uint32 cache_bytes = 6;
}
message InfoRequest {}
message ReplicaInfo { uint64 lineage = 1; uint64 applied_sequence = 2; uint64 primary_head = 3; uint64 lag = 4; }
message InfoResponse {
  uint32 format_version = 1;
  uint64 sequence = 2;
  optional uint64 lineage = 3;
  bool encrypted = 4;
  optional uint64 encryption_key_id = 5;
  bool commit_timestamps = 6;
  bool is_replica = 7;
  optional ReplicaInfo replica = 8;
}
